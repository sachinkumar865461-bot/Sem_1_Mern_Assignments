<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Contact - Sachin kumar</title>
</head>
<body>

    <p style="font-size: 30px;"><a href="index.html">&larr; Back to Home</a></p>

    <section style="max-width: 500px; margin: 0 auto; background-color: #1a2b2f62; padding: 20px; border-radius: 10px;">
        <h2>Contact Me</h2>
        <p>Let's learn and build together. Fill out the form below to get in touch!</p>

        <form>
            <div style="margin-bottom: 15px;">
                <label for="name" style="display: block; margin-bottom: 5px; color: #000000;">Name:</label>
                <input type="text" id="name" name="name" required style="width: 100%; padding: 10px; border-radius: 6px; border: none;">
            </div>

            <div style="margin-bottom: 15px;">
                <label for="email" style="display: block; margin-bottom: 5px; color: #060606;">Email:</label>
                <input type="email" id="email" name="email" required style="width: 100%; padding: 10px; border-radius: 6px; border: none;">
            </div>

            <div style="margin-bottom: 15px;">
                <label for="message" style="display: block; margin-bottom: 5px; color: #040404;">Message:</label>
                <textarea id="message" name="message" rows="5" required style="width: 100%; padding: 10px; border-radius: 6px; border: none; resize: vertical;"></textarea>
            </div>

            <button type="submit" style="background-color: #76c7c0; color: #0b2228; border: none; padding: 10px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%;">
                Send Message
            </button>
        </form>

        <div style="margin-top: 30px; text-align: center;">
            <p>Or directly email at: <a href="mailto:sachinkumar865461@gmail.com">sachinkumar865461@gmail.com</a></p>
        </div>
    </section>

</body>
</html>
